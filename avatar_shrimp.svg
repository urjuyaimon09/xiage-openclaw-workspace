<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 深色背景 -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="neonGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 255, 255, 0.3)"/>
      <stop offset="50%" stop-color="rgba(255, 0, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  <rect width="1024" height="1024" fill="url(#neonGradient)"/>
  
  <!-- 赛博网格 -->
  <g opacity="0.1">
    <g stroke="#00ffff" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="1024"/>
      <line x1="40" y1="0" x2="40" y2="1024"/>
      <line x1="80" y1="0" x2="80" y2="1024"/>
      <line x1="120" y1="0" x2="120" y2="1024"/>
      <line x1="160" y1="0" x2="160" y2="1024"/>
      <line x1="200" y1="0" x2="200" y2="1024"/>
      <line x1="240" y1="0" x2="240" y2="1024"/>
      <line x1="280" y1="0" x2="280" y2="1024"/>
      <line x1="320" y1="0" x2="320" y2="1024"/>
      <line x1="360" y1="0" x2="360" y2="1024"/>
      <line x1="400" y1="0" x2="400" y2="1024"/>
      <line x1="440" y1="0" x2="440" y2="1024"/>
      <line x1="480" y1="0" x2="480" y2="1024"/>
      <line x1="520" y1="0" x2="520" y2="1024"/>
      <line x1="560" y1="0" x2="560" y2="1024"/>
      <line x1="600" y1="0" x2="600" y2="1024"/>
      <line x1="640" y1="0" x2="640" y2="1024"/>
      <line x1="680" y1="0" x2="680" y2="1024"/>
      <line x1="720" y1="0" x2="720" y2="1024"/>
      <line x1="760" y1="0" x2="760" y2="1024"/>
      <line x1="800" y1="0" x2="800" y2="1024"/>
      <line x1="840" y1="0" x2="840" y2="1024"/>
      <line x1="880" y1="0" x2="880" y2="1024"/>
      <line x1="920" y1="0" x2="920" y2="1024"/>
      <line x1="960" y1="0" x2="960" y2="1024"/>
      <line x1="1000" y1="0" x2="1000" y2="1024"/>
      
      <line x1="0" y1="0" x2="1024" y2="0"/>
      <line x1="0" y1="40" x2="1024" y2="40"/>
      <line x1="0" y1="80" x2="1024" y2="80"/>
      <line x1="0" y1="120" x2="1024" y2="120"/>
      <line x1="0" y1="160" x2="1024" y2="160"/>
      <line x1="0" y1="200" x2="1024" y2="200"/>
      <line x1="0" y1="240" x2="1024" y2="240"/>
      <line x1="0" y1="280" x2="1024" y2="280"/>
      <line x1="0" y1="320" x2="1024" y2="320"/>
      <line x1="0" y1="360" x2="1024" y2="360"/>
      <line x1="0" y1="400" x2="1024" y2="400"/>
      <line x1="0" y1="440" x2="1024" y2="440"/>
      <line x1="0" y1="480" x2="1024" y2="480"/>
      <line x1="0" y1="520" x2="1024" y2="520"/>
      <line x1="0" y1="560" x2="1024" y2="560"/>
      <line x1="0" y1="600" x2="1024" y2="600"/>
      <line x1="0" y1="640" x2="1024" y2="640"/>
      <line x1="0" y1="680" x2="1024" y2="680"/>
      <line x1="0" y1="720" x2="1024" y2="720"/>
      <line x1="0" y1="760" x2="1024" y2="760"/>
      <line x1="0" y1="800" x2="1024" y2="800"/>
      <line x1="0" y1="840" x2="1024" y2="840"/>
      <line x1="0" y1="880" x2="1024" y2="880"/>
      <line x1="0" y1="920" x2="1024" y2="920"/>
      <line x1="0" y1="960" x2="1024" y2="960"/>
      <line x1="0" y1="1000" x2="1024" y2="1000"/>
    </g>
  </g>
  
  <!-- 龙虾头部 -->
  <ellipse cx="512" cy="550" rx="280" ry="220" fill="#1a1a2e"/>
  <ellipse cx="512" cy="550" rx="280" ry="220" stroke="#00ffff" stroke-width="8" filter="url(#glow-blue)" fill="none"/>
  <ellipse cx="512" cy="520" rx="220" ry="160" stroke="#ff00ff" stroke-width="4" filter="url(#glow-pink)" fill="none" transform="rotate(-10 512 520)"/>
  
  <!-- 龙虾眼睛 -->
  <!-- 左眼 -->
  <ellipse cx="400" cy="480" rx="50" ry="40" fill="#000000"/>
  <ellipse cx="400" cy="480" rx="25" ry="25" fill="#00ffff" filter="url(#glow-blue)"/>
  <circle cx="410" cy="470" r="8" fill="#ffffff"/>
  
  <!-- 右眼 -->
  <ellipse cx="620" cy="480" rx="50" ry="40" fill="#000000"/>
  <ellipse cx="620" cy="480" rx="25" ry="25" fill="#ff00ff" filter="url(#glow-pink)"/>
  <circle cx="630" cy="470" r="8" fill="#ffffff"/>
  
  <!-- 左钳子 -->
  <path d="M 200 580 Q 150 500 220 420 Q 280 400 320 460 Q 340 520 280 590 Z" fill="#2a2a4e" stroke="#00ffff" stroke-width="6" filter="url(#glow-blue)"/>
  
  <!-- 右钳子 -->
  <path d="M 820 580 Q 870 500 800 420 Q 740 400 700 460 Q 680 520 740 590 Z" fill="#2a2a4e" stroke="#ff00ff" stroke-width="6" filter="url(#glow-pink)"/>
  
  <!-- 机械管线 -->
  <path d="M 512 380 Q 480 480 512 580 Q 540 480 512 380" fill="none" stroke="#00ffff" stroke-width="6" filter="url(#glow-blue)"/>
  
  <!-- 机械细节线条 -->
  <g stroke="#4a4a6e" stroke-width="2">
    <line x1="320" y1="580" x2="320" y2="660"/>
    <line x1="355" y1="580" x2="355" y2="660"/>
    <line x1="390" y1="580" x2="385" y2="660"/>
    <line x1="425" y1="580" x2="420" y2="660"/>
    <line x1="460" y1="580" x2="455" y2="660"/>
    <line x1="495" y1="580" x2="490" y2="660"/>
    <line x1="530" y1="580" x2="530" y2="660"/>
    
    <line x1="660" y1="580" x2="660" y2="660"/>
    <line x1="695" y1="580" x2="695" y2="660"/>
    <line x1="730" y1="580" x2="735" y2="660"/>
    <line x1="765" y1="580" x2="770" y2="660"/>
    <line x1="800" y1="580" x2="805" y2="660"/>
    <line x1="835" y1="580" x2="840" y2="660"/>
    <line x1="870" y1="580" x2="870" y2="660"/>
  </g>
  
  <!-- 赛博文字 -->
  <text x="512" y="950" font-size="36" fill="#00ffff" text-anchor="middle" filter="url(#glow-blue)">🦞 CYBER LOBSTER</text>
</svg>
